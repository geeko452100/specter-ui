name: Run job crawler

on:
  schedule:
    # Every 6 hours. GitHub's cron scheduler is best-effort and can run a
    # few minutes late under load — fine for this, nothing here is
    # time-sensitive.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-crawler
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-crawler/requirements.txt

      - run: pip install -r requirements.txt

      # resume.txt is gitignored (real name/contact info) — the export step
      # (crawler/matcher.py) needs it on disk to score postings, so write it
      # from a secret rather than committing it.
      - run: echo "$RESUME_TEXT" > profile/resume.txt
        env:
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}

      - run: python -m crawler.run
        env:
          CRAWLER_CONTACT_EMAIL: ${{ secrets.CRAWLER_CONTACT_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
