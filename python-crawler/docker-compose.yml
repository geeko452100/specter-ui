services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: specter_jobs
    ports:
      # Mapped to 5433 (not the default 5432) so this doesn't collide with
      # a Postgres instance already running locally for another project.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
